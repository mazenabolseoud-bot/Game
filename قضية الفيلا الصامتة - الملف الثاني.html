<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>قضية الفيلا الصامتة — الملف الثاني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1b2418;
    --board-dark:#10160d;
    --paper:#EFE6D0;
    --paper-edge:#DFCFA0;
    --paper-dark:#E2D6B6;
    --ink:#241F1A;
    --ink-soft:#5B4E3E;
    --stamp:#9E2B25;
    --gold:#AD8A4E;
    --success:#3E6B41;
    --warn:#8a6d1a;
    --line:rgba(36,31,26,.18);
    --crit:#7a2b25;
    --part:#8a6d1a;
    --rh:#4a5d3a;
    --contra:#5a3a7a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.03), transparent 40%),
      repeating-linear-gradient(45deg, rgba(0,0,0,.025) 0 2px, transparent 2px 6px),
      var(--board);
    min-height:100vh;
    font-family:'Cairo',sans-serif;
    color:var(--ink);
    padding:22px 12px 70px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .masthead{text-align:center;margin-bottom:16px;color:var(--paper);}
  .masthead .kicker{font-size:12px;letter-spacing:.12em;color:var(--gold);margin-bottom:6px;}
  .masthead h1{font-family:'Rakkas',serif;font-size:32px;margin:0;line-height:1.25;color:var(--paper);text-shadow:0 2px 0 rgba(0,0,0,.35);}
  .folder{background:var(--paper);border-radius:6px 6px 14px 14px;box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.05);position:relative;overflow:hidden;background-image:radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px);background-size:6px 6px;}
  .folder-tab{background:var(--stamp);color:var(--paper);display:inline-block;font-family:'Rakkas',serif;font-size:14px;padding:6px 18px;border-radius:0 0 8px 8px;margin-inline-start:24px;letter-spacing:.03em;}
  .folder-body{padding:18px 16px 24px;}

  .statusbar{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;background:var(--paper);padding:8px 2px;}
  .team-pill{background:rgba(0,0,0,.08);border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38%;}
  .score-pill{background:var(--gold);color:var(--board-dark);padding:6px 12px;border-radius:20px;font-weight:800;font-size:13px;}
  .clock-pill{background:rgba(0,0,0,.08);border:1px solid var(--line);padding:6px 10px;border-radius:20px;font-size:11.5px;color:var(--ink-soft);}

  .tabs{display:flex;gap:5px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs button{flex:0 0 auto;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:12px;padding:8px 11px;border-radius:8px 8px 0 0;background:rgba(0,0,0,.08);color:var(--ink-soft);opacity:.75;}
  .tabs button.active{background:var(--ink);color:var(--paper);opacity:1;}
  .tabs button .lock{font-size:10px;}

  h2.stage-title{font-family:'Rakkas',serif;color:var(--stamp);font-size:23px;margin:0 0 4px;}
  .stage-sub{color:var(--ink-soft);font-size:13px;margin-bottom:12px;}
  .storybox{background:var(--paper-dark);border-inline-start:4px solid var(--stamp);padding:13px 15px;border-radius:4px;font-size:14.5px;line-height:1.85;margin-bottom:14px;}
  .cluebox{background:#fff9ec;border:1px dashed var(--gold);padding:13px 15px;border-radius:4px;font-size:14.5px;line-height:1.9;margin-bottom:12px;white-space:pre-line;}
  .code-seq{font-family:'Cairo',sans-serif;font-weight:800;font-size:17px;letter-spacing:.03em;direction:ltr;text-align:center;background:var(--ink);color:#f2e9d0;padding:11px;border-radius:6px;margin:10px 0;}
  .legend{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;background:rgba(0,0,0,.04);padding:8px;border-radius:6px;margin-bottom:12px;text-align:center;}
  .legend div span{display:block;color:var(--ink-soft);font-size:9.5px;}

  label.field-label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px;}
  select, input[type=text], textarea{width:100%;padding:10px 11px;font-family:'Cairo',sans-serif;font-size:14.5px;border-radius:6px;border:1px solid var(--line);background:#fffefb;color:var(--ink);}
  textarea{resize:vertical;min-height:90px;line-height:1.7;}
  .choice-grid{display:grid;gap:7px;margin:6px 0 4px;}
  .choice-btn{text-align:right;padding:11px 13px;border-radius:6px;border:1px solid var(--line);background:#fffefb;font-family:'Cairo',sans-serif;font-size:14px;cursor:pointer;}
  .choice-btn:hover{background:#fbf3dd;}
  .choice-btn.selected{border-color:var(--stamp);background:#fbeee8;}
  .check-row{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fffefb;margin-bottom:6px;font-size:13.5px;cursor:pointer;}
  .check-row input{width:auto;}
  .frag-btn{display:inline-block;margin:3px;padding:8px 12px;border-radius:16px;border:1px solid var(--gold);background:#fffefb;font-size:14px;cursor:pointer;}
  .frag-btn.used{opacity:.35;pointer-events:none;}
  .frag-line{min-height:42px;background:var(--ink);color:#f2e9d0;border-radius:6px;padding:9px 12px;font-size:15px;direction:rtl;margin:8px 0;}

  .btn{display:inline-block;background:var(--stamp);color:#fff8ec;border:none;padding:11px 20px;border-radius:6px;font-family:'Cairo',sans-serif;font-weight:800;font-size:14px;cursor:pointer;margin-top:6px;}
  .btn.secondary{background:var(--ink);}
  .btn.ghost{background:transparent;color:var(--stamp);border:1.5px solid var(--stamp);}
  .btn.small{padding:7px 12px;font-size:12.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .feedback{margin-top:10px;font-weight:700;font-size:13.5px;padding:10px 12px;border-radius:6px;}
  .feedback.ok{background:#e7f2e5;color:var(--success);}
  .feedback.bad{background:#f7e2df;color:var(--stamp);}
  .feedback.info{background:#eef1fb;color:#33447a;}

  .suspect-card{background:#fffefb;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;line-height:1.8;}
  .suspect-card b{color:var(--ink);}

  details.organizer{margin-top:20px;background:rgba(0,0,0,.05);border-radius:8px;padding:4px 14px;font-size:13px;}
  details.organizer summary{cursor:pointer;padding:9px 0;font-weight:700;color:var(--stamp);}
  details.organizer p, details.organizer li{line-height:1.85;}

  .puzzle-card{background:#fffefb;border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px;margin-bottom:14px;}
  .puzzle-card.locked{opacity:.55;}
  .ptag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:10px;color:#fff;margin-inline-end:6px;}
  .hintbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .hint-btn{font-size:11.5px;background:transparent;border:1px dashed var(--ink-soft);color:var(--ink-soft);padding:5px 9px;border-radius:14px;cursor:pointer;}
  .hint-text{background:#fff3d8;border-radius:6px;padding:8px 10px;font-size:12.5px;margin-top:6px;line-height:1.7;}

  .ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  @media (max-width:520px){.ev-grid{grid-template-columns:1fr;}}
  .ev-card{background:#fffefb;border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;position:relative;}
  .ev-card:hover{background:#fbf6e9;}
  .ev-cat{font-size:10.5px;color:var(--gold);font-weight:800;}
  .ev-title{font-weight:800;font-size:14px;margin:2px 0 4px;}
  .ev-snip{font-size:12px;color:var(--ink-soft);line-height:1.6;max-height:38px;overflow:hidden;}
  .ev-status{position:absolute;top:8px;left:8px;font-size:9.5px;padding:2px 7px;border-radius:10px;background:#eee;color:#555;}
  .ev-status.important{background:#f7e2df;color:var(--stamp);}
  .ev-status.uncertain{background:#fff3d8;color:var(--warn);}
  .ev-status.redf{background:#e4e9de;color:var(--rh);}
  .ev-status.connected{background:#e7f2e5;color:var(--success);}
  .locked-card{background:rgba(0,0,0,.04);border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--ink-soft);font-size:13px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:200;overflow:auto;}
  .modal{background:var(--paper);border-radius:10px;max-width:520px;width:100%;padding:18px 16px 20px;box-shadow:0 20px 50px rgba(0,0,0,.5);margin:20px 0;}
  .modal h3{font-family:'Rakkas',serif;color:var(--stamp);font-size:20px;margin:0 0 6px;}
  .modal .close-x{float:left;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}
  .modal .modal-body{white-space:pre-line;line-height:1.85;font-size:14.5px;background:#fffefb;border:1px solid var(--line);border-radius:6px;padding:12px;margin:8px 0 12px;}
  .tagform{background:rgba(0,0,0,.04);border-radius:6px;padding:10px;margin-top:8px;}
  .tagform label{font-size:12px;font-weight:700;display:block;margin:6px 0 3px;}
  .chip{display:inline-block;background:var(--ink);color:#fff8ec;font-size:11px;padding:3px 9px;border-radius:12px;margin:3px 4px 0 0;}

  .board-suspect{background:#fffefb;border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:9px;}
  .board-suspect b{font-size:14.5px;}
  .board-suspect .links{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.7;}
  .board-check{background:var(--ink);color:var(--paper);border-radius:8px;padding:14px;margin:14px 0;font-size:13px;line-height:1.8;}

  .tl-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .tl-time{flex:0 0 78px;font-weight:800;font-size:12.5px;background:var(--ink);color:#f2e9d0;padding:6px 5px;border-radius:6px;text-align:center;}
  .tl-row select{flex:1;font-size:12.5px;padding:8px;}

  .final-field{background:#fffefb;border:1px solid var(--line);border-radius:8px;padding:12px 13px;margin-bottom:11px;}
  .final-result{text-align:center;padding:14px 6px;}
  .debrief{text-align:right;}
  .debrief h4{color:var(--stamp);font-family:'Rakkas',serif;font-size:18px;margin:18px 0 6px;}
  .debrief .te-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .debrief .te-time{flex:0 0 80px;font-weight:800;color:var(--gold);}
  .debrief .rh-item{background:#fdf3f2;border-radius:6px;padding:9px 11px;margin-bottom:7px;font-size:13.5px;line-height:1.75;}

  .lb-btn{position:fixed;top:12px;inset-inline-end:12px;background:var(--gold);color:var(--board-dark);border:none;border-radius:20px;padding:8px 14px;font-family:'Cairo',sans-serif;font-weight:800;font-size:12px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.4);z-index:250;}
  .lb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:260;}
  .lb-panel{background:var(--paper);border-radius:10px;max-width:440px;width:100%;max-height:82vh;overflow:auto;padding:20px 18px 22px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .lb-panel h3{font-family:'Rakkas',serif;color:var(--stamp);font-size:20px;margin:0 0 4px;text-align:center;}
  .lb-sub{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-bottom:12px;}
  .lb-row{display:flex;align-items:center;gap:8px;background:#fffefb;border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin-bottom:6px;font-size:13.5px;}
  .lb-row.me{border-color:var(--stamp);background:#fbeee8;}
  .lb-rank{font-weight:800;color:var(--gold);width:22px;flex:0 0 auto;}
  .lb-name{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-progress{font-size:10.5px;color:var(--ink-soft);flex:0 0 auto;}
  .lb-score{font-weight:800;color:var(--success);flex:0 0 auto;min-width:30px;text-align:center;}
  .lb-empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:16px 0;}
  .lb-close{display:block;margin:14px auto 0;background:var(--ink);color:#fff8ec;border:none;padding:9px 22px;border-radius:6px;font-family:'Cairo',sans-serif;font-weight:700;cursor:pointer;}

  .footer-tools{text-align:center;margin-top:18px;}
  .footer-tools button{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--paper-edge);font-size:11px;padding:6px 12px;border-radius:14px;cursor:pointer;margin:0 4px;}

  @media (max-width:400px){.masthead h1{font-size:25px;} .legend{grid-template-columns:repeat(5,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="kicker">ملف قضية رقم ٧٧٤ — سري وشخصي</div>
    <h1>قضية الفيلا الصامتة — الملف الثاني</h1>
  </div>
  <div class="folder">
    <div class="folder-tab">فريق التحقيق</div>
    <div class="folder-body" id="app"></div>
  </div>
</div>

<button class="lb-btn" id="lbOpenBtn" type="button">🏆 الترتيب</button>
<div class="lb-overlay" id="lbOverlay" style="display:none;">
  <div class="lb-panel">
    <h3>🏆 لوحة الترتيب المباشرة</h3>
    <div class="lb-sub">كل الفرق شايفة نفس الترتيب ده أول بأول</div>
    <div id="lbList"><div class="lb-empty">بنجيب الترتيب...</div></div>
    <button class="lb-close" id="lbCloseBtn" type="button">قفل</button>
  </div>
</div>

<script>
/* =========================================================================
   SECTION 1: DATA
   ========================================================================= */
const SUSPECTS = [
  {id:'salma',   name:'سلمى الفار',    role:'الزوجة'},
  {id:'adel',    name:'عادل حمدي',     role:'الشريك في الشركة'},
  {id:'yasmine', name:'ياسمين سعيد',   role:'السكرتيرة الشخصية'},
  {id:'hossam',  name:'حسام الفار',    role:'الأخ الأصغر'},
  {id:'sayed',   name:'سيد عبدالله',   role:'الحارس الشخصي'},
];
const SUSPECT_BIOS = {
  salma:'كانت في البيت طول الليل. بتقول إنها كانت نايمة من الساعة عشرة.',
  adel:'شريك كريم في الشركة. اتخانق معاه بالليل على موضوع فلوس ناقصة، وبيقول إنه مشى بدري.',
  yasmine:'السكرتيرة الشخصية لكريم من 4 سنين. بتقول إنها قعدت في المكتبة تشتغل على أوراق لحد الساعة 11:30 تقريبًا.',
  hossam:'الأخ الأصغر. عنده ديون، واتخانق مع كريم بالنهار على فلوس. بيقول إنه مشى بدري قوي.',
  sayed:'الحارس الشخصي والسائق. بيقول إنه كان بيعمل جولة حراسة حوالين الفيلا طول الليل.',
};
const WEAPONS = [
  {id:'gun', name:'مسدس'}, {id:'poison', name:'سم في الشاي'}, {id:'knife', name:'سكينة'},
  {id:'rope', name:'حبل خنق'}, {id:'statue', name:'تمثال رخام'},
];
const LOCATIONS = [
  {id:'office', name:'المكتب'}, {id:'bedroom', name:'غرفة النوم'}, {id:'kitchen', name:'المطبخ'},
  {id:'garden', name:'الجنينة'}, {id:'library', name:'المكتبة'},
];
const MOTIVES = [
  {id:'money', name:'اختلاس فلوس الشركة'}, {id:'affair', name:'خيانة زوجية'}, {id:'inherit', name:'الميراث'},
  {id:'revenge', name:'انتقام قديم'}, {id:'scandal', name:'التهديد بفضيحة'},
];
const ENTRY_OPTIONS = [
  {id:'a_gate', name:'من البوابة الرئيسية سيرًا على الأقدام'},
  {id:'b_kitchen', name:'من الباب الخلفي جنب المطبخ'},
  {id:'c_terrace', name:'من تراس الجنينة اللي بيوصل بين المكتبة والمكتب مباشرة، من غير كاميرا ولا بطاقة دخول'},
  {id:'d_window', name:'من شباك غرفة النوم'},
];
const TIME_OPTIONS = [
  {id:'t2315', name:'11:15 بالليل'}, {id:'t2322', name:'11:22 بالليل'},
  {id:'t2331', name:'11:31 بالليل'}, {id:'t2345', name:'11:45 بالليل'},
];
const TIMELINE_SLOTS = [
  {id:'t2100', label:'9:00 بالليل'}, {id:'t2200', label:'10:00 بالليل'}, {id:'t2230', label:'10:30 بالليل'},
  {id:'t2300', label:'11:00 بالليل'}, {id:'t2315', label:'11:15 بالليل'}, {id:'t2322', label:'11:22 بالليل'},
  {id:'t2330', label:'11:30 بالليل'}, {id:'t2331', label:'11:31 بالليل'}, {id:'t2345', label:'11:45 بالليل'},
  {id:'t0000', label:'12:00 (بعد نص الليل)'},
];
const ANSWER = {suspect:'hossam', weapon:'statue', location:'office', motive:'inherit', time:'t2331', entry:'c_terrace', misleading:'yasmine'};
const RED_HERRING_POOL = ['E02','E13','E19'];
const PROOF_POOL = ['E08','E09','E10','E14','E15','E16','E17','E18','E24','E26','E30','E34','E35'];

/* Timeline event bank: 10 correct events (mapped to slots) + 4 decoys (slot:null) */
const TIMELINE_EVENTS = [
  {id:'ev1',  text:'مشادة كلامية بين كريم وعادل في المكتب بخصوص فلوس ناقصة من حساب الشركة', slot:'t2100'},
  {id:'ev2',  text:'عربية عادل بتخرج من بوابة الفيلا الرئيسية (كاميرا البوابة)', slot:'t2200'},
  {id:'ev3',  text:'حد بيستخدم لابتوب عادل المفتوح جوه المكتب عشان يعمل تحويل مالي مشبوه باسمه', slot:'t2230'},
  {id:'ev4',  text:'كريم بيكلم المحاسب مصطفى تليفونيًا لمدة 6 دقايق بخصوص أرقام غريبة', slot:'t2300'},
  {id:'ev5',  text:'كريم بيبعت رسالة لياسمين: "تعالي المكتب دلوقتي، لازم نتكلم"', slot:'t2315'},
  {id:'ev6',  text:'ياسمين بتسيب المكتبة وتتجه للمكتب عن طريق تراس الجنينة', slot:'t2322'},
  {id:'ev7',  text:'مواجهة قصيرة بين كريم وياسمين في المكتب حول الأرقام اللي اكتشفها، وبتسيب المكتب مضايقة بعد دقايق', slot:'t2330'},
  {id:'ev8',  text:'حسام، اللي كان راجع الفيلا في الخفاء ومستني في الجنينة، بيدخل من التراس فور ما ياسمين تمشي، وبيتخانق مع كريم على الفلوس، والخناقة بتتطور لضربة قوية بالتمثال الرخامي كريم بيتوفى بيها على الفور تقريبًا', slot:'t2331'},
  {id:'ev9',  text:'سيد بيبلغ غرفة الحراسة عبر اللاسلكي إنه لسه بيعمل جولته وكل حاجة هادية', slot:'t2345'},
  {id:'ev10', text:'عربية ياسمين بتخرج من بوابة الفيلا الرئيسية (كاميرا البوابة)', slot:'t0000'},
  {id:'ev11', text:'سلمى بتنزل تشرب حاجة سخنة في المطبخ وتكلم أختها تليفونيًا', slot:null},
  {id:'ev12', text:'حسام بيرجع الفيلا تاني بعد الخناقة (يقول إنه عشان ياخد حاجاته) — مفيش كاميرا ولا سجل رسمي يقدر يحدد وقت رجوعه بالظبط', slot:null},
  {id:'ev13', text:'عادل بيرجع الفيلا بعد ما يخلص عشاه بره', slot:null},
  {id:'ev14', text:'سيد بيلاقي جثة كريم في المكتب أثناء الجولة الأخيرة', slot:null},
];

/* ---- Evidence: id, cat, title, room(r1/r2), cls(critical/partial/red_herring/contradiction),
       text (what players see), meaning (developer truth for debrief), susp/loc/time tags ---- */
const EVIDENCE = [

const STORAGE_KEY = 'case774v1-state';
const LB_LS_KEY = 'case774v1-leaderboard';
const LB_API = new URL('leaderboard.php', window.location.href).href;

function freshState(){
  return {

    timelinePicks:{},    // {slotId: eventId}
    p5picks:[], p6picks:[], p9picks:[],
    boardReady:false,
    finalSubmitted:false, finalPicks:null, finalResult:null,
    modal:null,           // currently open evidence id
  };
}
let state = freshState();

function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadPersisted(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const parsed = JSON.parse(raw); state = Object.assign(freshState(), parsed); }
  }catch(e){}
}
loadPersisted();

/* =========================================================================
   SECTION 4: LEADERBOARD (shared storage, adapted from base file)
   ========================================================================= */
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LB_LS_KEY)||'{}'); }catch(e){ return {}; } }
function lsWrite(all){ localStorage.setItem(LB_LS_KEY, JSON.stringify(all)); }
const localBoard = {
  async set(key,value){ const all=lsRead(); all[key]=value; lsWrite(all); },
  async get(key){ const all=lsRead(); return Object.prototype.hasOwnProperty.call(all,key)?{value:all[key]}:null; },
  async list(prefix){ return {keys:Object.keys(lsRead()).filter(k=>k.startsWith(prefix))}; },
  async delete(key){ const all=lsRead(); delete all[key]; lsWrite(all); }
};
const phpBoard = {
  async all(){ const r=await fetch(LB_API,{cache:'no-store'}); if(!r.ok) throw new Error('http '+r.status); return r.json(); },
  async set(key,value){ const r=await fetch(LB_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value})}); if(!r.ok) throw new Error('save failed'); },
  async get(key){ const all=await this.all(); return Object.prototype.hasOwnProperty.call(all,key)?{value:all[key]}:null; },
  async list(prefix){ const all=await this.all(); return {keys:Object.keys(all).filter(k=>k.startsWith(prefix))}; },
  async delete(key){ const r=await fetch(LB_API+'?key='+encodeURIComponent(key),{method:'DELETE'}); if(!r.ok) throw new Error('delete failed'); }
};
const storageReady = (async ()=>{
  if(window.storage && typeof window.storage.set==='function') return window.storage;
  if(location.protocol==='http:'||location.protocol==='https:'){
    try{ const r=await fetch(LB_API,{cache:'no-store'}); if(r.ok) return phpBoard; }catch(e){}
  }
  return localBoard;
})();
function slugify(s){ return (s||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^\p{L}\p{N}-]/gu,'').slice(0,30)||'team'; }
async function pushScore(){
  if(!state.teamKey) return;
  try{
    const storage = await storageReady;
    const solvedCount = Object.values(state.puzzles).filter(Boolean).length;
    await storage.set('leaderboard:'+state.teamKey, JSON.stringify({
      name: state.teamName, score: state.score, solvedCount,
      finalSubmitted: state.finalSubmitted,
      correctCount: state.finalResult ? state.finalResult.correctCount : 0,
      updatedAt: Date.now()
    }), true);
  }catch(e){ console.error('leaderboard push failed', e); }
}
async function fetchLeaderboard(){
  try{
    const storage = await storageReady;
    const list = await storage.list('leaderboard:', true);
    if(!list||!list.keys||!list.keys.length) return [];
    const entries = await Promise.all(list.keys.map(async k=>{
      try{ const r=await storage.get(k,true); const v=r?JSON.parse(r.value):null; if(v) v.key=k; return v; }
      catch(e){ return null; }
    }));
    return entries.filter(Boolean).sort((a,b)=> b.score-a.score || a.updatedAt-b.updatedAt);
  }catch(e){ console.error('leaderboard fetch failed', e); return []; }
}
async function renderLeaderboard(){
  const listEl = document.getElementById('lbList');
  if(!listEl) return;
  const entries = await fetchLeaderboard();
  if(!entries.length){ listEl.innerHTML = '<div class="lb-empty">لسه محدش من الفرق بدأ أو سجل نتيجة.</div>'; return; }
  listEl.innerHTML = entries.map((e,i)=>{
    const mine = e.key === 'leaderboard:'+state.teamKey;
    const progress = e.finalSubmitted ? `✅ ${e.correctCount}/7` : `${e.solvedCount}/11`;
    return `<div class="lb-row${mine?' me':''}"><span class="lb-rank">#${i+1}</span><span class="lb-name">${esc(e.name)}</span><span class="lb-progress">${progress}</span><span class="lb-score">${e.score}</span></div>`;
  }).join('');
}
let lbTimer = null;
document.getElementById('lbOpenBtn').addEventListener('click', ()=>{
  document.getElementById('lbOverlay').style.display='flex';
  renderLeaderboard();
  lbTimer = setInterval(renderLeaderboard, 4000);
});
function closeLb(){
  document.getElementById('lbOverlay').style.display='none';
  if(lbTimer){ clearInterval(lbTimer); lbTimer=null; }
}

/* =========================================================================
   SECTION 5: HELPERS
   ========================================================================= */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function byId(arr,id){ return arr.find(x=>x.id===id); }
function nameOf(arr,id){ const f=byId(arr,id); return f?f.name:'—'; }
function evById(id){ return EVIDENCE.find(e=>e.id===id); }

function solved(pid){ return !!state.puzzles[pid]; }
function solvePuzzle(pid){
  if(!state.puzzles[pid]){ state.puzzles[pid]=true; persist(); pushScore(); }
}
function wrongAttempt(){
  state.score -= 5; state.wrongCount = (state.wrongCount||0)+1; persist(); pushScore();
}
function room2Unlocked(){
  return ['P1','P2','P3','P8'].filter(p=>solved(p)).length >= 2;
}
function evidenceUnlocked(ev){
  if(ev.room==='r1') return true;
  return room2Unlocked();
}
function evidenceContentReady(ev){
  if(ev.locked && ev.id==='E27') return solved('P4');
  return true;
}
function useHint(pid, level){
  const cost = level===1?5:(level===2?10:20);
  const key = pid+'_h'+level;
  if(state.hintsUsed[key]) return;
  if(!confirm('هل تريدون استخدام التلميح رقم '+level+'؟ هيتخصم '+cost+' نقطة من رصيدكم.')) return;
  state.hintsUsed[key] = true;
  state.score -= cost;
  persist(); pushScore(); render();
}

  const app = document.getElementById('app');
  app.innerHTML = '';
  if(!state.started){ app.appendChild(renderJoin()); return; }
  app.appendChild(renderStatusBar());
  app.appendChild(renderTabs());
  let content;
  if(state.tab==='briefing') content = renderBriefing();
  else if(state.tab==='evidence') content = renderEvidenceRoom();
  else if(state.tab==='puzzles') content = renderPuzzlesHub();
  else if(state.tab==='board') content = renderCaseBoard();
  else if(state.tab==='final') content = renderFinalTab();
  app.appendChild(content);
  if(state.modal){ app.appendChild(renderEvidenceModal(state.modal)); }
  app.appendChild(renderFooterTools());
}

const STATUS_LABELS = {unreviewed:'لسه محدّش راجعها', important:'مهمة', uncertain:'مش متأكدين', red_herring_guess:'ممكن تكون تضليل', connected:'متربطة بنظرية'};

function renderEvidenceRoom(){
  const w = el(`<div>
    <h2 class="stage-title">غرفة الأدلة</h2>
    <div class="stage-sub">افتحوا أي دليل عشان تشوفوا تفاصيله وتربطوه بمشتبه به أو مكان أو وقت</div>
  </div>`);
  if(!room2Unlocked()){
    w.appendChild(el(`<div class="cluebox">غرفة الأدلة التانية لسه مقفولة. حلّوا لغزين على الأقل من الألغاز الأربعة الأولى (الشيفرة، اللغز المنطقي، مخطط الفيلا، كشف الكذب) عشان تتفتح.</div>`));
  }
  const filterRow = el(`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
    <select id="statusFilter" style="width:auto;flex:1;">
      <option value="">كل الحالات</option>
      ${Object.keys(STATUS_LABELS).map(k=>`<option value="${k}">${STATUS_LABELS[k]}</option>`).join('')}
    </select>
  </div>`);
  w.appendChild(filterRow);
  const grid = el(`<div class="ev-grid"></div>`);
  w.appendChild(grid);
  function draw(filter){
    grid.innerHTML='';
    const visible = EVIDENCE.filter(evidenceUnlocked);
    visible.filter(ev=>!filter || (state.status[ev.id]||'unreviewed')===filter).forEach(ev=>{
      const st = state.status[ev.id]||'unreviewed';
      const isLockedContent = !evidenceContentReady(ev);
      const card = el(`<div class="ev-card">
        <span class="ev-status${st!=='unreviewed'?' '+(st==='red_herring_guess'?'redf':st):''}">${STATUS_LABELS[st]}</span>
        <div class="ev-cat">${ev.cat}</div>
        <div class="ev-title">${ev.id} — ${ev.title}</div>
        <div class="ev-snip">${isLockedContent ? '🔒 محتاج حل لغز معيّن عشان تتكشف كاملة' : esc(ev.text).slice(0,90)+'…'}</div>
      </div>`);
      card.onclick = ()=>{ state.modal = ev.id; render(); };
      grid.appendChild(card);
    });
    if(!grid.children.length){ grid.appendChild(el(`<div class="locked-card">مفيش أدلة تتعرض بالفلتر ده دلوقتي.</div>`)); }
  }
  filterRow.querySelector('#statusFilter').onchange = (e)=>draw(e.target.value);
  draw('');
  return w;
}

function renderEvidenceModal(evId){
  const ev = evById(evId);
  const overlay = el(`<div class="modal-overlay"></div>`);
  const contentReady = evidenceContentReady(ev);
  const bodyText = contentReady ? ev.text : '🔒 المحتوى الكامل للدليل ده هيتكشف بعد حل لغز "استرجاع رسالة محذوفة" في تبويب الألغاز.';
  const links = state.links[ev.id] || {suspect:'', location:'', time:'', motive:''};
  const modal = el(`<div class="modal">
    <button class="close-x" type="button">✕</button>
    <h3>${ev.id} — ${ev.title}</h3>
    <div style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">📁 التصنيف: ${ev.cat}</div>
    <div class="modal-body">${esc(bodyText)}</div>

    <label class="field-label">📌 حالة الدليل (تقييم فريقكم)</label>
    <select id="statusSel">
      ${Object.keys(STATUS_LABELS).map(k=>`<option value="${k}" ${((state.status[ev.id]||'unreviewed')===k)?'selected':''}>${STATUS_LABELS[k]}</option>`).join('')}
    </select>

    <div class="tagform">
      <div style="font-weight:800;font-size:12.5px;">🔗 روابط الفريق (تخمين وتحليل الفريق — مش معلومة مؤكدة من الملف)</div>
      <label>مشتبه به</label>
      <select id="linkSuspect"><option value="">بدون</option>${SUSPECTS.map(s=>`<option value="${s.id}" ${links.suspect===s.id?'selected':''}>${s.name}</option>`).join('')}</select>
      <label>مكان</label>
      <select id="linkLoc"><option value="">بدون</option>${LOCATIONS.map(s=>`<option value="${s.id}" ${links.location===s.id?'selected':''}>${s.name}</option>`).join('')}</select>
      <label>وقت</label>
      <select id="linkTime"><option value="">بدون</option>${TIMELINE_SLOTS.map(s=>`<option value="${s.id}" ${links.time===s.id?'selected':''}>${s.label}</option>`).join('')}</select>
      <label>دافع محتمل</label>
      <select id="linkMotive"><option value="">بدون</option>${MOTIVES.map(s=>`<option value="${s.id}" ${links.motive===s.id?'selected':''}>${s.name}</option>`).join('')}</select>
      <button class="btn small" id="saveLink" style="margin-top:8px;">💾 حفظ الربط</button>
    </div>
  </div>`);
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ state.modal=null; render(); } });
  modal.querySelector('.close-x').onclick = ()=>{ state.modal=null; render(); };
  modal.querySelector('#statusSel').onchange = (e)=>{ state.status[ev.id]=e.target.value; persist(); };
  modal.querySelector('#saveLink').onclick = ()=>{
    state.links[ev.id] = {
      suspect: modal.querySelector('#linkSuspect').value,
      location: modal.querySelector('#linkLoc').value,
      time: modal.querySelector('#linkTime').value,
      motive: modal.querySelector('#linkMotive').value,
    };
    persist(); render();
  };
  return overlay;
}

function puzzleCardShell(pid, unlocked, innerHtml){
  const meta = PUZZLES[pid];
  const card = el(`<div class="puzzle-card ${unlocked?'':'locked'}">
    <span class="ptag" style="background:${meta.color}">${meta.type}</span>
    <b>${meta.title}</b> ${solved(pid)?'✅':''}
  </div>`);
  if(!unlocked){
    card.appendChild(el(`<div class="locked-card" style="margin-top:8px;">🔒 هيتفتح بعد تقدّم أكتر في التحقيق.</div>`));
    return card;
  }
  card.appendChild(el(`<div>${innerHtml}</div>`));
  return card;
}

function renderHintBar(pid){
  const bar = el(`<div class="hintbar"></div>`);
  [1,2,3].forEach(level=>{
    const key = pid+'_h'+level;
    const cost = level===1?5:(level===2?10:20);
    const used = state.hintsUsed[key];
    const btn = el(`<button class="hint-btn" type="button">💡 تلميح ${level} (-${cost})</button>`);
    btn.onclick = ()=>useHint(pid, level);
    bar.appendChild(btn);
    if(used){ bar.appendChild(el(`<div class="hint-text" style="flex-basis:100%;">${esc(PUZZLES[pid].hints[level-1])}</div>`)); }
  });
  return bar;
}

   SECTION 11: FINAL ACCUSATION TAB
   ========================================================================= */
function keywordScore(text){
  const KEY_TERMS = ['ياسمين','تمثال','مكتب','اختلاس','تراس','رسالة','بصمة','عادل','قميص','كاميرا','11:31','23:31'];
  const t = (text||'');
  let hits = KEY_TERMS.filter(k=>t.includes(k)).length;
  let score = Math.min(16, hits*2);
  if(t.trim().length>40) score += 4;
  return {hits, score};
}
function computeFinalScore(picks){
  const checks = [['suspect','yasmine'],['weapon','statue'],['location','office'],['motive','money'],['time','t2331'],['entry','c_terrace'],['misleading','yasmine']];
  const flags = {}; let correctCount=0;
  checks.forEach(([f,val])=>{ const ok = picks[f]===val; flags[f]=ok; if(ok) correctCount++; });
  const proofPicks = picks.evidence||[];
  const proofCorrect = proofPicks.filter(id=>PROOF_POOL.includes(id)).length;
  const proofScore = Math.min(9, proofCorrect*3);
  const rhOk = RED_HERRING_POOL.includes(picks.redHerring);
  const kw = keywordScore(picks.explanation);
  const objectiveScore = correctCount*6;
  const solvedCase = flags.suspect && flags.weapon && flags.location && flags.motive;
  let totalDelta = objectiveScore + proofScore + (rhOk?5:0) + kw.score;
  if(solvedCase) totalDelta += 20;
  if(!flags.suspect) totalDelta -= 25;
  return {flags, correctCount, proofCorrect, rhOk, kw, totalDelta, solvedCase};
}

    <div class="debrief">
      <h4>✅ الحل الكامل</h4>
      <p style="line-height:1.9;">الجاني هو <b>حسام الفار</b>، الأخ الأصغر. ضرب كريم الفار بـ<b>تمثال رخامي</b> كان على رف مكتبه، في <b>المكتب</b>، حوالين الساعة <b>11:31 بالليل</b>. الدافع: حسام كان غرقان في ديون وتحت تهديد مرابي، وكان محتاج سلفة عاجلة من <b>الميراث</b>/فلوس العيلة، وكريم رفض يديله حاجة وهددّه إنه ممكن يشيله من التوزيع. بعد الخناقة النهارية، حسام سايب الفيلا بعربيته الساعة 6:10 مساءً (زي ما أكدت كاميرا البوابة)، لكنه رجع تاني في الخفاء بالليل وقعد مستني في الجنينة. لما ياسمين اتخانقت مع كريم وخرجت من المكتب مضايقة الساعة 11:30 تقريبًا، دخل حسام من نفس اللحظة عن طريق <b>تراس الجنينة</b> اللي بيوصل مباشرة بين المكتبة والمكتب — المسار الوحيد في الفيلا من غير كاميرا ولا بطاقة دخول — وواجه كريم؛ الخناقة اتطورت لضربة قاتلة.</p>

      <h4>🗓️ الخط الزمني الحقيقي الكامل</h4>
      ${TIMELINE_SLOTS.map(slot=>{
        const evt = TIMELINE_EVENTS.find(e=>e.slot===slot.id);
        return `<div class="te-row"><div class="te-time">${slot.label}</div><div>${evt?evt.text:''}</div></div>`;
      }).join('')}

      <h4>🎭 الأدلة المضلّلة ولماذا</h4>
      ${EVIDENCE.filter(e=>e.cls==='red_herring'||e.cls==='contradiction').map(e=>`<div class="rh-item"><b>${e.id} — ${e.title}</b><br>${esc(e.meaning)}</div>`).join('')}

      <h4>🔑 ليه الأدلة الحرجة كانت مهمة</h4>
      ${EVIDENCE.filter(e=>e.cls==='critical').slice(0,10).map(e=>`<div class="rh-item" style="background:#eef6ec;"><b>${e.id} — ${e.title}</b><br>${esc(e.meaning)}</div>`).join('')}
    </div>
    <button class="btn secondary" id="resubmit" style="margin-top:14px;">✏️ عدّلوا نظريتكم وقدّموها تاني</button>
  </div>`);
  w.querySelector('#resubmit').onclick = ()=>{ state.finalSubmitted=false; persist(); render(); };
  return w;
}

/* =========================================================================
   SECTION 12: INIT
   ========================================================================= */
render();
</script>
</body>
</html>
